<!doctype html>
<html lang="fa" dir="rtl">

<head>

<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>راه‌های ارتباطی مسجد تکیه</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{

    margin:0;

    font-family:Tahoma, Arial, sans-serif;

    background:#000;

    background-image:url("./IMG_20260828_232427_872.jpg");

    background-repeat:no-repeat;

    background-position:center top;

    background-size:100% auto;

    background-attachment:fixed;

    display:flex;

    justify-content:center;

    align-items:flex-start;

    min-height:100vh;

    padding-top:300px;

    padding-bottom:30px;
}


/* کادر سفید */

.card{

    width:86%;

    max-width:380px;

    background:rgba(255,255,255,0.97);

    border-radius:28px;

    padding:24px 22px 20px;

    text-align:center;

    border:2px solid #d5ad58;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.35),
        0 0 18px rgba(212,170,75,0.18);
}


/* عنوان */

h1{

    margin:0 0 12px;

    color:#16482d;

    font-size:27px;

    line-height:1.7;

    font-weight:bold;
}


/* خط طلایی */

.divider{

    width:70%;

    height:1px;

    background:#d9b76b;

    margin:10px auto 12px;

    position:relative;
}


/* متن */

.description{

    color:#777;

    font-size:16px;

    line-height:1.8;

    margin:0 0 16px;
}


/* دکمه‌ها */

a{

    display:flex;

    align-items:center;

    justify-content:center;

    width:100%;

    min-height:62px;

    margin:11px 0;

    padding:12px 15px;

    border-radius:18px;

    text-decoration:none;

    color:#fff;

    font-size:18px;

    font-weight:bold;

    border:2px solid #d5ad58;

    box-shadow:
        0 6px 14px rgba(0,0,0,0.18);

    transition:transform .2s;
}


a:active{

    transform:scale(.97);
}


/* اینستاگرام */

.insta{

    background:linear-gradient(
        135deg,
        #d41472,
        #c21870,
        #b90068
    );
}


/* ایتا */

.eitaa{

    background:linear-gradient(
        135deg,
        #ff9800,
        #f57c00
    );
}


/* آیکن */

.icon{

    margin-left:9px;

    font-size:21px;
}


/* خط پایین */

.bottom-divider{

    width:70%;

    height:1px;

    background:#d9b76b;

    margin:18px auto 10px;
}


/* آیدی */

small{

    display:block;

    color:#888;

    font-size:13px;

    direction:ltr;
}


/* تنظیم برای گوشی */

@media(max-width:600px){

    body{

        padding-top:300px;

    }

    .card{

        width:86%;

        max-width:360px;

        padding:22px 19px 18px;

        border-radius:26px;

    }

    h1{

        font-size:25px;

    }

    .description{

        font-size:15px;

        margin-bottom:14px;

    }

    a{

        min-height:58px;

        font-size:17px;

        margin:10px 0;

    }

    small{

        font-size:12px;

    }

}

</style>

</head>


<body>


<div class="card">


    <h1>
        راه‌های ارتباطی
    </h1>


    <div class="divider"></div>


    <p class="description">
        یکی از گزینه‌های زیر را انتخاب کنید
    </p>


    <a
        class="insta"
        href="https://instagram.com/masjed_takie_hosseiny"
        target="_blank"
    >

        <span class="icon">📸</span>

        ورود به اینستاگرام

    </a>


    <a
        class="eitaa"
        href="https://eitaa.com/masjedtakye"
        target="_blank"
    >

        <span class="icon">📱</span>

        ورود به کانال ایتا

    </a>


    <div class="bottom-divider"></div>


    <small>
        @masjed_takie_hosseiny
    </small>


</div>


</body>

</html>
